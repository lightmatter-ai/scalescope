## Sweep DSL example (new system)
##
## This file is a template for the new sweep DSL used by `scalescope/run_scalescope.py`.
##
## Key ideas:
## - `leaves`: each leaf sets 1+ paths with aligned `cases` OR uses a `generator`.
## - `sweep`: expression tree over leaves using `cartesian`, `zip` (strict by default), and `union`.
## - Optional inline filtering via `where: [verifier_names]` with `on_fail: skip|error`.
##
leaves:
  batch:
    paths: [workload_spec.global_batch_size]
    cases:
      - [1]
      - [64]
      - [512]

  # Example of a 2D split leaf (paths are aligned tuples).
  tp2d_split:
    paths:
      - logical_topology.tag_size.TP_Proj_X
      - logical_topology.tag_size.TP_Proj_YZ
    generator:
      name: decompose_with_balanced_multiplicands
      args: {min_val: 64, max_val: 2048, step: 64}

sweep:
  cartesian:
    - ref: batch
    - ref: tp2d_split
  where: [pydantic_valid]
  on_fail: skip
