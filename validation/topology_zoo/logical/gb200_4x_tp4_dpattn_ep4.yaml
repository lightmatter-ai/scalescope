# Logical: 4-chip TP group with DP-attention + EP=4 (gpt-oss-120b on
# GB200 NVL72, InferenceX shape `decode_tp=4 decode_ep=4
# decode_dp_attention=True num_decode_gpu=4`).
#
# See `gb200_2x_tp2_dpattn_ep2.yaml` for the DP-attention convention.
# Here each chip holds full attention weights and 32 of 128 experts.
#
# Dimension consistency on a 4-chip ScaleUpFabric:
#   - attention group:  DP_Attn_SU × TP_Attn_X = 4 × 1 = 4 ✓
#   - moe       group:  DP_MoE × EP_SU × TP_MoE_X = 1 × 4 × 1 = 4 ✓
#
# Companion case carries `num_colocated_experts = 32` (= 128 / EP_SU).

name: "GB200_4x_TP4_DPattn_EP4"

dimensions:
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 4
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 4
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
