# Logical: TP=4 across 4 B200s on a single NVL Switch slice. Used for
# InferenceX non-disagg MiniMax-M2.5 TP=4 records (FP4 and FP8). All
# parts of the layer (attention QKVO and MoE per-expert weights) are
# TP-sharded 4-way.

name: "B200_4x_TP4"

dimensions:
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 4
  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 4
  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 4
  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
