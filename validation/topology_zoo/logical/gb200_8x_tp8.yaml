# Logical: TP=8 across 8 GB200 dies on one NVL72 island.
#
# Used as the parallelism HYPOTHESIS for InferenceX disagg-decode rows where
# `decode_tp = 8, decode_ep = 1, decode_dp_attention = false, num_decode_gpu = 8`.
# All 128 experts are colocated on each chip, TP-sharded along the d_ff
# axis. Same parallelism shape as `b200_8x_tp8.yaml` but on NVL72 GB200
# dies — per-link NVLink-5 nominal bandwidth is identical.

name: "GB200_8x_TP8"

dimensions:
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
