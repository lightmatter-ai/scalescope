# Logical: TP=8 across 8 B200s on a single NVL Switch domain. Used by
# the InferenceX B200x8 records (MiniMax-M2.5 and Llama-3.3-70B served
# at TP=8 across the full 8-GPU box).

name: "B200_8x_TP8"

dimensions:
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  # TP_MoE = TP_Attn = 8: experts (or the single dense FFN) are tensor-parallel-
  # sharded along d_ff across the full TP domain, forming one complete set spanning
  # all 8 chips (num_complete_expert_sets = 1). This is the faithful "clean TP=8,
  # EP=1" layout used by both the dense Llama cases and the MoE MiniMax-M2.5 case,
  # and it matches the sibling b200_2x_tp2 / b200_4x_tp4 topologies (TP_MoE = 2/4).
  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 8
  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1

  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "ScaleUpFabric"
    size: 1
