# 4× GB200 Blackwell dies on a single NVLink-Switch (NVL72) island.
#
# See `gb200_2x.yaml` for the NVL72 fabric assumption. A 4-die slice is the
# most common disagg-decode shape for gpt-oss-120b in InferenceX (15 of 34
# disagg rows). Per-die NVLink-5: 1.8 TB/s aggregate bidirectional
# (900 GB/s outgoing).

name: "GB200_4x"

node_definition_ref: "GB200_NODE"

dimensions:
  - name: "ScaleUpFabric"
    interconnect_name: "fast_fabric"
    topology_type: "switched"
    size: 4
