# 2× GB200 Blackwell dies on a single NVLink-Switch (NVL72) island.
#
# GB200 NVL72 packages 36 Grace-coupled superchips (= 72 Blackwell dies)
# into one NVLink-Switch domain. Any subset of N ≤ 72 dies lives inside the
# same fabric with the same per-link nominal bandwidth as a 2-die slice.
# Per-die NVLink-5: 1.8 TB/s aggregate bidirectional (900 GB/s outgoing,
# matching the `GB200_INTERCONNECT` component).
#
# Used by InferenceX disagg-decode rows where `num_decode_gpu = 2` and the
# decode pool sits inside one NVL72 island. The prefill pool is on a
# different island and is invisible to ScaleScope under the disagg
# decode-only modelling assumption.

name: "GB200_2x"

node_definition_ref: "GB200_NODE"

dimensions:
  - name: "ScaleUpFabric"
    interconnect_name: "fast_fabric"
    topology_type: "switched"
    size: 2
