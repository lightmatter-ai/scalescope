# NVIDIA TensorRT-LLM perf-overview throughput tables.
#
# Source: https://nvidia.github.io/TensorRT-LLM/performance/perf-overview.html
# Snapshot date: 2026-05-08.  Reproducible via the trtllm-bench commands
# documented on that page (synthetic dataset of fixed (ISL, OSL)).
#
# Metric: ``Total Output Throughput (tokens/sec)`` — the system-wide
# aggregate output token rate at saturating concurrency (offline /
# infinite-rate request stream).  Per-user TPOT is NOT reported on
# this page; to obtain it we'd need to re-run trtllm-bench locally
# (the printed log includes per-user TPOT but the public table only
# shows aggregate throughput).
#
# These numbers provide an (ISL, OSL) throughput sweep for the
# saturating-batch regime, complementing the InferenceX decode records.

schema_version: 1
source: "NVIDIA TensorRT-LLM v0.21 perf-overview"
url: "https://nvidia.github.io/TensorRT-LLM/performance/perf-overview.html"
metric: "Total Output Throughput (tokens/sec) — system aggregate"
methodology: |
  Throughput run with trtllm-bench at saturating request rate. KV cache
  set to 0.95 of free GPU memory (or 0.90 / lower if OOM). Synthetic
  dataset, fixed (ISL, OSL), zero stdev. PyTorch backend.
notes:
  - Llama-3.3-70B is structurally identical to Llama-3.1-70B (same
    d_model=8192, num_layers=80, num_heads=64, num_kv_heads=8,
    intermediate_size=28672, GQA, SwiGLU). ScaleScope can use the
    existing llama3_70b model spec.
  - Llama-3.1-405B FP8 numbers exist for H100 and H200; FP4 numbers
    exist only for B200 / GB200.
  - Llama-4-Maverick requires G3 (chunked-attention alternation) per
    `scalescope_model_feature_gaps.md` — DEFERRED (not in panel).

models:

  llama3_1_8b:
    precision: fp8
    huggingface_repo: nvidia/Llama-3.1-8B-Instruct-FP8
    runs:
      - { gpu: GH200,  tp: 1, isl: 128,    osl: 128,   total_output_tps: 27304.25 }
      - { gpu: GH200,  tp: 1, isl: 128,    osl: 2048,  total_output_tps: 24045.60 }
      - { gpu: GH200,  tp: 1, isl: 128,    osl: 4096,  total_output_tps: 15409.85 }
