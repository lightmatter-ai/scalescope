[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "scalescope"
version = "0.1.0"
description = "Analytic modeling for cluster workloads"
requires-python = ">=3.11"

dependencies = [
    "altair>=5.3.0",
    "matplotlib>=3.10.0",
    "mplcursors>=0.6",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "scipy>=1.15.1",
    "seaborn>=0.13.1",
    "tqdm>=4.66.2",
    "PyYAML==6.0.2",
    "pydantic>=2.11.0",
    "pywebview>=4.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "pytest",
    "pre-commit"
]

[project.scripts]

scalescope-cli = "scalescope.run_scalescope:main"
scalescope-app = "main_app:main"

[tool.setuptools]
packages = ["scalescope"]

# [tool.setuptools.packages.find]
# where = ["scalescope"]

[tool.isort]
known_first_party = ["scalescope"]
profile = "black"
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_alphabetical_sort_within_sections = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
ignore = ["D104"]
extend-ignore = ["E203", "W503"]
max-line-length = 100

[tool.pytest.ini_options]
pythonpath = [
  "."
]
