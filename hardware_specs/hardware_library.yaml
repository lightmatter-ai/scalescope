# hardware_library.yaml
# Defines reusable hardware components and node configurations.
#
# All compute FLOPS figures are dense (no sparsity).

components:
  compute:
    # NVIDIA H100 SXM5 (Hopper).
    #   - FP8:  1979 TFLOPS
    #   - BF16: ~989 TFLOPS
    #   - FP32: 66.9 TFLOPS
    H100_COMPUTE:
      fp8_nominal: 1979e12
      bf16_nominal: 1000e12
      fp32_nominal: 66.9e12
      efficiency: 0.7
    # NVIDIA GB200 NVL (Grace-coupled Blackwell die). Per-Blackwell-die FLOPS.
    # GB200 dies are the higher-binned Blackwell variant (vs. B200 SXM5):
    #   - FP4:  10 PFLOPS
    #   - FP8:  5  PFLOPS
    #   - BF16: 2.5 PFLOPS
    # https://resources.nvidia.com/en-us-blackwell-architecture
    GB200_COMPUTE:
      fp4_nominal: 10000e12
      fp8_nominal: 5000e12
      bf16_nominal: 2500e12
      fp32_nominal: null
      efficiency: 0.7
    # NVIDIA B200 (SXM5, standalone Blackwell GPU, distinct from GB200
    # NVL-coupled superchip). Per Blackwell datasheet:
    #   - FP4:  9000 TFLOPS
    #   - FP8:  4500 TFLOPS
    #   - BF16: 2250 TFLOPS
    # https://resources.nvidia.com/en-us-blackwell-architecture
    B200_COMPUTE:
      fp4_nominal: 9000e12
      fp8_nominal: 4500e12
      bf16_nominal: 2250e12
      fp32_nominal: null
      efficiency: 0.7
    ALTERNATIVE_COMPUTE:
      fp8_nominal: 17000e12
      bf16_nominal: 8500e12
      fp32_nominal: 4250e12
      efficiency: 0.7

  memory:
    H100_MEMORY:
      bandwidth_per_stack_nominal: 670e9 # 670 GB/s per stack -> 3.35 TB/s aggregate (SXM5 HBM3)
      size_per_stack: 16e9            # 16 GB -> 80 GB total
      num_stack: 5
      efficiency: 0.7
    GB200_MEMORY:
      bandwidth_per_stack_nominal: 1000e9 # 1 TB/s
      size_per_stack: 24e9             # 24 GB
      num_stack: 8
      efficiency: 0.7
    # B200 SXM5 (180 GB capacity SKU used in MLPerf v5.0 submissions).
    # 8 stacks of HBM3e × 22.5 GB = 180 GB; aggregate 8 TB/s nominal.
    # Some B200 SKUs ship with 192 GB (8 × 24 GB stacks); we choose the
    # 180 GB variant to match the labelled MLPerf systems
    # ("B200-SXM-180GBx8_TRT").
    B200_MEMORY:
      bandwidth_per_stack_nominal: 1000e9 # 1 TB/s per stack -> 8 TB/s aggregate
      size_per_stack: 22.5e9           # 22.5 GB per stack -> 180 GB total
      num_stack: 8
      efficiency: 0.7
    ALTERNATIVE_MEMORY:
      bandwidth_per_stack_nominal: 1500e9 # 1500e9 # 1.5 TB/s
      size_per_stack: 24e9             # 24 GB
      num_stack: 12
      efficiency: 0.7
    ALTERNATIVE_MEMORY_REMOTE:
      bandwidth_per_stack_nominal: 3000e9 # 3.0 TB/s
      size_per_stack: 24e9             # 24 GB
      num_stack: 12
      efficiency: 0.7

  interconnect:
    # Passage Interconnects
    PASSAGE_INTERCONNECT_8TB:
      name: "Passage_8TB/s_Interconnect"
      type: "Passage"
      num_links: 1
      bandwidth_nominal: 4032e9 # 2 * 36 * 112 * 1e9 / 2 = 4032e9 (approx 4 TB/s outgoing)
      latency_sec: 150e-9
      efficiency: 0.8
    PASSAGE_INTERCONNECT_8TB_HALF:
      name: "Passage_8TB/s_Interconnect_Half"
      type: "Passage"
      num_links: 1
      bandwidth_nominal: 2016e9 # 4032e9 / 2
      latency_sec: 150e-9
      efficiency: 0.8
    PASSAGE_INTERCONNECT_8TB_THIRD:
      name: "Passage_8TB/s_Interconnect_Third"
      type: "Passage"
      num_links: 1
      bandwidth_nominal: 1344e9 # 4032e9 / 3
      latency_sec: 150e-9
      efficiency: 0.8

    # Chip-Specific Interconnects
    H100_INTERCONNECT:
      name: "H100_Interconnect"
      type: "NVLink"
      num_links: 18
      bandwidth_nominal: 450e9 # 900 GB/s total / 2 = 450 GB/s outgoing
      # Empirical small-message all-reduce latency floor from the validation panel.
      latency_sec: 5e-6
      efficiency: 0.8
    GB200_INTERCONNECT:
      name: "GB200_Interconnect"
      type: "NVLink"
      num_links: 18
      bandwidth_nominal: 900e9 # 1800 GB/s total / 2 = 900 GB/s outgoing
      # Realized NCCL small-message all-reduce latency floor (see H100_INTERCONNECT).
      latency_sec: 5e-6
      efficiency: 0.8
    # B200 SXM5 NVLink-5: 1.8 TB/s aggregate bidirectional ->
    # 900 GB/s unidirectional (matches GB200 chip-to-chip; the difference
    # between B200 and GB200 lives at the inter-node Switch fabric, not
    # the per-chip NVLink).
    B200_INTERCONNECT:
      name: "B200_Interconnect"
      type: "NVLink"
      num_links: 18
      bandwidth_nominal: 900e9
      # Realized NCCL small-message all-reduce latency floor (see H100_INTERCONNECT).
      latency_sec: 5e-6
      efficiency: 0.8
    ALTERNATIVE_INTERCONNECT:
      name: "Alternative_Interconnect"
      type: "NVLink"
      num_links: 18
      bandwidth_nominal: 1800e9 # 2 * 1800 GB/s total / 2 = 1.8 TB/s outgoing
      latency_sec: 150e-9
      efficiency: 0.8

    # DP-Specific Interconnects
    DP_INTERCONNECT_INFINIBAND:
      name: "Infiniband_DP_Interconnect"
      type: "Infiniband"
      num_links: 1 # Aggregate view for DP
      bandwidth_nominal: 200e9 # 1600 Gbps / 8 bits/byte  = 200 GB/s uindirectional
      latency_sec: 2e-6
      efficiency: 0.8

nodes:
  # Standard nodes
  H100_NODE:
    node_name: "H100"
    device_compute: "H100_COMPUTE"
    device_memory_tiers:
      xpu_memory: "H100_MEMORY"
    device_interconnects:
      "fast_fabric": "H100_INTERCONNECT"
      "cluster_fabric": "DP_INTERCONNECT_INFINIBAND"
  GB200_NODE:
    node_name: "GB200_1.8TB/s_Interconnect"
    device_compute: "GB200_COMPUTE"
    device_memory_tiers:
      xpu_memory: "GB200_MEMORY"
    device_interconnects:
      "fast_fabric": "GB200_INTERCONNECT"
      "cluster_fabric": "DP_INTERCONNECT_INFINIBAND"
  # NVIDIA B200 SXM5 standalone GPU node — used for HGX-B200 and DGX-B200
  # platforms in MLPerf v5.0. Same per-chip NVLink-5 as GB200 NVL but with
  # InfiniBand cluster fabric (no NVL Switch over many trays).
  B200_NODE:
    node_name: "B200_SXM5_HGX"
    device_compute: "B200_COMPUTE"
    device_memory_tiers:
      xpu_memory: "B200_MEMORY"
    device_interconnects:
      "fast_fabric": "B200_INTERCONNECT"
      "cluster_fabric": "DP_INTERCONNECT_INFINIBAND"
  ALTERNATIVE_NODE:
    node_name: "Alternative_3.6TB/s_Interconnect"
    device_compute: "ALTERNATIVE_COMPUTE"
    device_memory_tiers:
      xpu_memory: "ALTERNATIVE_MEMORY"
    device_interconnects:
      "fast_fabric": "ALTERNATIVE_INTERCONNECT"
      "cluster_fabric": "DP_INTERCONNECT_INFINIBAND"

  # Passage nodes
  PASSAGE_NODE_8TB_ALTERNATIVE:
    node_name: "Passage_8TB/s_Interconnect_Alternative"
    device_compute: "ALTERNATIVE_COMPUTE"
    device_memory_tiers:
      xpu_memory: "ALTERNATIVE_MEMORY"
      remote_memory: "ALTERNATIVE_MEMORY_REMOTE"
    device_interconnects:
      "fast_fabric": "PASSAGE_INTERCONNECT_8TB"
      "fast_fabric_x": "PASSAGE_INTERCONNECT_8TB_HALF"
      "fast_fabric_y": "PASSAGE_INTERCONNECT_8TB_HALF"
      "fast_fabric_y0": "PASSAGE_INTERCONNECT_8TB_THIRD"
      "fast_fabric_y1": "PASSAGE_INTERCONNECT_8TB_THIRD"
      "cluster_fabric": "DP_INTERCONNECT_INFINIBAND"
