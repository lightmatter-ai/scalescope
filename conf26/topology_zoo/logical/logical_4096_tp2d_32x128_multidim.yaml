name: "CONF26_TP4096_TP2D_32x128_MultiDim_EPFull"

dimensions:
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "Domain128"
    size: 1

  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "Domain32"
    size: 32
  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "Domain128"
    size: 128

  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "Domain32"
    size: 32
  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "Domain128"
    size: 128

  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "Domain128"
    size: 1
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "Domain32"
    size: 1
  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "Domain128"
    size: 1

  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "Domain32"
    size: 1
  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "Domain128"
    size: 1

  # Full EP domain to support expert-count sweeps with c=1.
  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "Domain128"
    size: 128
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "Domain32"
    size: 32
