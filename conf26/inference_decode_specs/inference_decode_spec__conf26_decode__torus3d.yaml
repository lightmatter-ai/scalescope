# CONF26 decode spec for torus-3D TP modeling (16x16x16).
# Uses split Y as two dimensions so N-D collective modeling can engage both.

global_batch_size: 64
micro_batch_size: 1
prefill_seq_len: 1
num_generated_tokens: 1
seq_length: 1
# Host kernel-launch floor not modeled
kernel_launch_latency_per_layer_sec: 0.0

decode_moe_router_sync_mode: replicated_router
# MoE software/runtime overhead per routed token-expert pair per layer per pass.
# Applies independently of network A2A; 0.0 = not modeled.
moe_token_pair_overhead_sec: 0.0
float_size_bytes: 1

memory_device_map_traffic:
  weights: xpu_memory
  activations: xpu_memory
  gradients: xpu_memory
  kv_cache: xpu_memory

memory_device_map_footprint:
  weights: xpu_memory
  optimizer_states: xpu_memory
  saved_activations: xpu_memory
  gradient_buffers: xpu_memory
  kv_cache: xpu_memory
  transient_forward_peak: xpu_memory
  transient_backward_peak: xpu_memory

comp_comm_efficiency: 0.0
comp_mem_efficiency: 0.0
comm_mem_efficiency: 0.0

tp_moe_a2a_replication_optimization: true

tp_attn_spec:
  variant: SHARD_WEIGHTS_2D
  split_2d:
    x_tags: ["TP_Attn_X"]
    yz_tags: ["TP_Attn_Y", "TP_Attn_Y1"]

tp_proj_spec:
  variant: SHARD_WEIGHTS_2D
  split_2d:
    x_tags: ["TP_Proj_X"]
    yz_tags: ["TP_Proj_Y", "TP_Proj_Y1"]

tp_moe_spec:
  variant: SHARD_WEIGHTS_2D
  split_2d:
    x_tags: ["TP_MoE_X"]
    yz_tags: ["TP_MoE_Y", "TP_MoE_Y1"]

dp_spec:
  variant: DDP

moe_spec_v2:
  num_colocated_experts: 1024
  expert_imbalance: 1.0
  expert_weight_residency_policy: resident_active_subset
  expert_routing_distribution: bottleneck_group_collector_random

pp_spec:
  variant: GPIPE
