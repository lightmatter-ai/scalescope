name: "Passage_32_experts__tp2d_attn_moe"

dimensions:
  # PP is on scale out
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8

  # Attention TP split into 2D: X shards heads, Y (part of YZ) shards sequence/KV-cache
  - logical_tag: "TP_Attn_X"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  - logical_tag: "TP_Attn_Y"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  # Projection TP split into 2D (mirrors attention TP sizes for now).
  - logical_tag: "TP_Proj_X"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  - logical_tag: "TP_Proj_Y"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  # DP_Attn_SU: IntraPodFabric_size / (TP_Attn_X * TP_Attn_Y) = 512 / 16 = 32
  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 32

  # DP_Attn_SO: InterPodFabric_size / PP_stages = 64 / 8 = 8
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8

  # MoE TP split into 2D (total TP_MoE = 16): X shards hidden-dim, YZ shards embedding-dim
  - logical_tag: "TP_MoE_X"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  - logical_tag: "TP_MoE_Y"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 4

  # EP_SU is the number of XPUs allocated to the expert scale-up domain.
  # It is not expert count: one expert may be TP-sharded across several XPUs,
  # and multiple experts may be colocated on one XPU.
  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 32

  # 512 (full expert group size)/512 (scale-up domain size) = 1
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 1

  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8
