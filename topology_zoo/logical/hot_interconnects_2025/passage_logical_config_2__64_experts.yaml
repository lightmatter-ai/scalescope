name: "Passage_256_experts"

# 256 experts, 16 TP, 2 TP_MoE, 8 PP, 256 DP_attn

dimensions:
  # PP is on scale out
  - logical_tag: "PP"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8

  # Attention part
  - logical_tag: "TP_Attn"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 16

  # DP_Attn_SU: IntraPodFabric_size / TP_Attn_size = 512 / 16 = 32
  - logical_tag: "DP_Attn_SU"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 32

  # DP_Attn_SO: InterPodFabric_size / PP_stages = 64 / 8 = 8
  - logical_tag: "DP_Attn_SO"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8

  # Experts

  - logical_tag: "TP_MoE"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 8

  # EP_SU is the number of XPUs allocated to the expert scale-up domain.
  # It is not expert count: one expert may be TP-sharded across several XPUs,
  # and multiple experts may be colocated on one XPU.
  - logical_tag: "EP_SU"
    maps_to_physical_dimension_name: "IntraPodFabric"
    size: 512

  # The EP_SU domain has 512 XPUs and hosts all 64 experts, each sharded across 8 XPUs.
  # EP_SO=1 means the full expert set fits within one EP_SU domain.
  - logical_tag: "EP_SO"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 1

  - logical_tag: "DP_MoE"
    maps_to_physical_dimension_name: "InterPodFabric"
    size: 8
