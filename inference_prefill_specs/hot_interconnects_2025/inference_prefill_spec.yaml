## Inference prefill spec for Hot Interconnects'25 scenarios.
## Describes model placement (TP/DP/PP), prefill batch sizing, precision,
## and memory tier mappings used by the analytical prefill model.
## Values are per global prefill step across the whole cluster.

global_batch_size: 4096         # Total sequences processed per prefill step across all DP ranks
micro_batch_size: 2             # Micro-batch size per PP stage; per-DP batch = micro_batch_size * Num_PP_Stages
seq_length: 8192                # Tokens per sequence (context length) for prefill

float_size_bytes: 1             # Inference precision in bytes (e.g., 1 = int8/fp8)

# Memory tier mappings for traffic (bytes moved) during prefill.
memory_device_map_traffic:
  weights: xpu_memory           # Where weight reads are served from during prefill
  activations: xpu_memory       # Where activation reads/writes are served from
  gradients: xpu_memory         # Typically zero for inference; present for structural parity
  kv_cache: xpu_memory          # KV cache writes dominate in prefill (building cache)

# Memory tier mappings for persistent footprint on each XPU.
memory_device_map_footprint:
  weights: xpu_memory           # Parameter storage
  optimizer_states: xpu_memory  # Usually unused in inference
  saved_activations: xpu_memory # Minimal for prefill (no backward); may be 0
  gradient_buffers: xpu_memory  # Unused in inference
  kv_cache: xpu_memory          # KV cache footprint built during prefill
  transient_forward_peak: xpu_memory   # Peak transient forward working set
  transient_backward_peak: xpu_memory  # Zero for inference

# Overlap/efficiency knobs in the overlapped-time model (0..1).
overlap_model:
  kind: fixed
  comp_comm_efficiency: 0.7       # Overlap between compute and communication
  comp_mem_efficiency: 0.7        # Overlap between compute and memory traffic
  comm_mem_efficiency: 0.7        # Overlap between communication and memory traffic
kernel_launch_latency_per_layer_sec: 0.0  # per-layer host kernel-launch floor (0.0 = not modeled)
moe_token_pair_overhead_sec: 0.0  # per routed token-expert pair per MoE layer per pass
tp_moe_a2a_replication_optimization: true  # on: send to expert shard then all-gather across expert TP shards; off: regular routed MoE A2A

tp_attn_spec:
  variant: SHARD_WEIGHTS_1D     # Tensor-parallel strategy for attention weights

tp_moe_spec:
  variant: SHARD_WEIGHTS_1D     # Tensor-parallel strategy for MoE/FFN weights

dp_spec:
  variant: DDP                   # Data-parallel strategy

moe_spec_v2:
  num_colocated_experts: 1      # Number of experts hosted per XPU (expert colocation)
  expert_imbalance: 1.5         # Routed token skew multiplier (>= 1.0) affecting MoE a2a and compute
  expert_weight_residency_policy: resident_active_subset
  expert_routing_distribution: bottleneck_group_collector_random

pp_spec:
  variant: GPIPE                 # Pipeline-parallel strategy
